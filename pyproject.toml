[project]
name = "findmy-rest"
version = "0.5.0"
description = "REST API for Apple Find My accessory and device location and battery"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
authors = [{ name = "Ty Sarna" }]
keywords = ["findmy", "airtag", "apple", "location", "rest"]

dependencies = [
    "findmy>=0.10.1,<0.11",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.10",
]

[project.optional-dependencies]
# The FMIP backend (phones/laptops via the iCloud web endpoint) is optional: the
# accessory path is the product. `rich` is pinned in because pyicloud 2.7.0 imports
# it at module scope but only declares it under its own extras.
fmip = ["pyicloud>=2.7.0", "rich>=15.0.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx2", "ruff>=0.9"]

[project.scripts]
findmy-rest = "findmy_rest.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/findmy_rest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src"]
